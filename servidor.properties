puerto.nodos=5000
puerto.clientes=6000

hilos.locales=4

dataset.cifar.dir=datos/cifar-10-batches-bin
dataset.cifar.clases=
dataset.carpeta=datos/imagenes
dataset.maxPorClase=0

modelo.archivo=modelos/modelo.ocw
cnn.filtros1=8
cnn.filtros2=16
cnn.oculta=64
cnn.semilla=42

entrenamiento.lote=32
entrenamiento.lr=0.01
entrenamiento.momentum=0.9
entrenamiento.weightDecay=0.0001
# Plan del learning rate dentro de cada 'entrenar N': constante | coseno | escalon
# coseno: baja suavemente de lr a lr.final | escalon: usa lr.final desde la fraccion lr.escalon de las epocas
entrenamiento.lr.plan=coseno
entrenamiento.lr.final=0.0001
entrenamiento.lr.escalon=0.75

# Data augmentation: solo para las muestras de 'entrenar' (nunca en evaluar, verificar ni bench).
# Se sortea por muestra y por paso. Para comparar en el informe: augmentation.activo=false
augmentation.activo=true
augmentation.semilla=7
augmentation.volteo.prob=0.5
# Recorte aleatorio con relleno: desplaza hasta +-N pixeles (0 = sin recorte)
augmentation.desplazamiento=4
# Como se rellena lo que queda fuera de la imagen: reflejo | borde | gris
augmentation.relleno=reflejo
augmentation.rotacion.grados=12
augmentation.rotacion.prob=0.5
# Brillo: +-fraccion de 255 | contraste: factor en [1-c, 1+c] alrededor de la media
augmentation.color.prob=0.8
augmentation.brillo=0.15
augmentation.contraste=0.2
# Ruido gaussiano: sigma como fraccion de 255 (0.02 = ~5 niveles)
augmentation.ruido.prob=0.25
augmentation.ruido.sigma=0.02

inferencia.modo=datos
# Test-time augmentation: vistas promediadas por imagen en 'evaluar' y en el chat modo datos.
# 1 = sin TTA | 2 = original + espejo | 10 = ambas con desplazamientos de 2 px (verificar y bench no lo usan)
inferencia.tta=2
inferencia.bloque=32
chat.hilos=8
chat.colaMax=200
usuarios.archivo=usuarios.txt

tarea.timeoutMs=120000
resultados.dir=resultados
